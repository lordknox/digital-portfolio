name: Digital Portfolio CI/CD

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Run your portfolio build checks and tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5 # Upgraded version clears the runner warning

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      # Verifies the code compiles smoothly before releasing to production
      - name: Build Project
        run: npm run build --if-present

  # Job 2: Triggers Render only if the first job passes cleanly
  deploy-to-render:
    needs: build-and-test # Dependency safeguard
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Webhook Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
